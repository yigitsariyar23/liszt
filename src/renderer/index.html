<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <title>Liszt</title>
    <link rel="stylesheet" href="renderer.css" />
    <script src="renderer.js" defer></script>
  </head>
  <body>
    <header id="topbar">
      <div id="brand" title="Liszt">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <rect x="1" y="1" width="6" height="14" rx="1.5" />
          <rect x="9" y="1" width="6" height="6" rx="1.5" />
          <rect x="9" y="9" width="6" height="6" rx="1.5" />
        </svg>
      </div>
      <nav id="tabs"></nav>
      <button id="add-project" class="icon" title="Add project (⌘O)"></button>
      <div class="drag-space"></div>
      <button id="new-claude" class="tool claude" title="New Claude session (⌘T) · split right ⌘D"></button>
      <button id="new-shell" class="tool" title="New shell (⇧⌘T)"></button>
      <span class="tool-sep"></span>
      <button id="toggle-sidebar" class="tool" title="Changes (⌘B)"></button>
      <button id="toggle-sessions" class="tool" title="Sessions (⌘L)"></button>
      <button id="toggle-tasks" class="tool" title="Tasks (⌘J)"></button>
    </header>
    <div id="main">
      <aside id="sidebar">
        <section id="changes-view" class="side-view">
          <div class="side-head"><span>Changes</span><span id="side-project" class="muted"></span></div>
          <div id="git"></div>
        </section>
        <section id="sessions-view" class="side-view">
          <div class="side-head sessions-head"><span>Sessions</span><span id="sessions-count" class="muted"></span></div>
          <div class="session-tools">
            <input id="session-search" type="search" placeholder="Search title, project, folder" autocomplete="off" spellcheck="false" />
            <div class="session-selects">
              <label class="muted"
                >Show
                <select id="session-filter">
                  <option value="active">Active</option>
                  <option value="liszt">In Liszt</option>
                  <option value="running">Running</option>
                  <option value="pinned">Pinned</option>
                  <option value="archived">Archived</option>
                  <option value="all">All</option>
                </select>
              </label>
              <label class="muted"
                >Sort
                <select id="session-sort">
                  <option value="status">Status</option>
                  <option value="recent">Recent</option>
                  <option value="name">Name</option>
                  <option value="project">Project</option>
                </select>
              </label>
            </div>
          </div>
          <div id="session-list"></div>
        </section>
      </aside>
      <div id="center">
        <div id="sessionbar"></div>
        <main id="workspace">
          <div id="empty" class="placeholder">
            <div class="placeholder-title">No projects yet</div>
            <p>Add a folder and a Claude session starts in it.</p>
            <button id="empty-add" class="primary">Add project · ⌘O</button>
          </div>
        </main>
      </div>
      <aside id="tasks">
        <div class="side-head"><span>Tasks</span><span id="tasks-project" class="muted"></span></div>
        <div class="autopilot">
          <div class="autopilot-text">
            <div class="autopilot-title">Autopilot</div>
            <div class="muted">Claude takes Todo cards on its own, each in its own worktree</div>
          </div>
          <div class="autopilot-controls">
            <div class="seg"><button id="ap-off">Off</button><button id="ap-on">On</button></div>
            <label class="muted" title="Most cards in progress at once"
              >max
              <select id="ap-limit">
                <option>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
              </select>
            </label>
          </div>
        </div>
        <input id="task-input" placeholder="+ Add a task and press Enter" autocomplete="off" spellcheck="false" />
        <div id="task-list"></div>
      </aside>
    </div>
    <div id="pool"></div>
  </body>
</html>
